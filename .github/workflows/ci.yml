name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false # no go.sum: this module has no external dependencies

      - name: Install Qt Quick build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev qt6-declarative-dev qmake6 libglib2.0-dev libegl-dev \
            qml6-module-qtquick-controls qml6-module-qtquick-layouts \
            qml6-module-qtquick-templates qml6-module-qttest qml6-module-qtquick-window \
            qml6-module-qtqml-workerscript qml6-module-qtquick-dialogs

      - name: gofmt
        run: |
          fmted=$(gofmt -l .)
          if [ -n "$fmted" ]; then
            echo "gofmt needed on:"
            echo "$fmted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: Qt GUI build
        run: make build-gui

      - name: go test
        run: go test ./...

      # Skipped without KVM (and the rendering test without Wayland):
      # hosted runners exercise only the build of these tests.
      - name: Display protocol tests
        run: make test-display

      - name: Terminal emulator tests
        run: make test-terminal

      - name: GUI backend tests
        run: make test-backend

      - name: QML UI tests
        run: make test-qml
